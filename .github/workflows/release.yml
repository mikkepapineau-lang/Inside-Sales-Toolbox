name: Publier Toolbox
on:
  push:
    branches: [main, preview/teenage-engineering]
    paths: ['.release/*.json']
  workflow_dispatch:
    inputs:
      edition:
        description: Édition à publier
        type: choice
        options: [equipe, michael]
        default: equipe
permissions:
  contents: read
concurrency:
  group: toolbox-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview/teenage-engineering'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check.py
      - run: python3 scripts/verify-version-archives.py --archives-only
      - name: Vérifier et publier les éditions demandées
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_EDITION: ${{ inputs.edition }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/publish-requested.py
      - name: Publier la préversion équipe de la branche Teenage Engineering
        if: github.ref == 'refs/heads/preview/teenage-engineering'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY_GUARD'
          import json
          from pathlib import Path
          meta = json.loads(Path('.release/equipe.json').read_text())
          assert meta['edition'] == 'equipe' and meta['prerelease'] is True
          PY_GUARD
          python3 scripts/release.py --edition equipe --check
          python3 scripts/release.py --edition equipe --publish
